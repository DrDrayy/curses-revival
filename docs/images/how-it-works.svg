<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How curses-revival works: you speak, curses turns it into text, and the text goes to the VRChat chatbox, an OBS overlay and Twitch chat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="10" y="95" width="150" height="70" rx="12" fill="#6e40c9"/>
  <text x="85" y="125" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">You speak</text>
  <text x="85" y="147" text-anchor="middle" font-size="13" fill="#e8e0ff">VRChat mic muted</text>
  <line x1="162" y1="130" x2="252" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="80" width="210" height="100" rx="12" fill="#1f6feb"/>
  <text x="361" y="118" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">curses-revival</text>
  <text x="361" y="142" text-anchor="middle" font-size="13" fill="#dbe9ff">speech to text</text>
  <text x="361" y="161" text-anchor="middle" font-size="13" fill="#dbe9ff">Azure, Deepgram, browser</text>
  <line x1="468" y1="112" x2="566" y2="52" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="130" x2="566" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="148" x2="566" y2="208" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="570" y="22" width="180" height="58" rx="12" fill="#1a7f37"/>
  <text x="660" y="47" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">VRChat chatbox</text>
  <text x="660" y="67" text-anchor="middle" font-size="12" fill="#d8f5dd">over OSC</text>
  <rect x="570" y="101" width="180" height="58" rx="12" fill="#1a7f37"/>
  <text x="660" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">OBS overlay</text>
  <text x="660" y="146" text-anchor="middle" font-size="12" fill="#d8f5dd">captions on stream</text>
  <rect x="570" y="180" width="180" height="58" rx="12" fill="#1a7f37"/>
  <text x="660" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Twitch chat</text>
  <text x="660" y="225" text-anchor="middle" font-size="12" fill="#d8f5dd">your words as chat posts</text>
</svg>

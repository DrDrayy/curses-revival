name: 'build'
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm-lock.yaml is lockfile v9
      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # pinned: the locked "time" crate (0.3.30) does not compile on Rust 1.80 and newer
      - name: setup rust
        uses: dtolnay/rust-toolchain@1.79.0

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # no Twitch client id is built in: everyone enters their own in the app (Twitch tab)
      - name: build
        run: pnpm tauri build
        env:
          CURSES_TWITCH_CLIENT_ID: ${{ secrets.CURSES_TWITCH_CLIENT_ID }}

      # download from the run page (Actions tab)
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          # one download per branch: curses-fixes, curses-features
          name: curses-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/curses.exe
            src-tauri/target/release/bundle/msi/*.msi

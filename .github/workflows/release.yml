name: 'build'
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    # needed to publish a GitHub Release when a version tag is pushed
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm-lock.yaml is lockfile v9
      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # pinned: the releases are built and tested with this Rust version
      - name: setup rust
        uses: dtolnay/rust-toolchain@1.79.0

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # no Twitch client id is built in: everyone enters their own in the app (Twitch tab)
      - name: build
        run: pnpm tauri build
        env:
          CURSES_TWITCH_CLIENT_ID: ${{ secrets.CURSES_TWITCH_CLIENT_ID }}

      # one download per branch or tag: curses-fixes, curses-beta (the features branch holds the beta build),
      # curses-v0.1.5-fixes ...; a "/" in a branch name is not allowed in a download name
      - name: download name
        id: artifact
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          if [ "$ref" = "features" ]; then ref="beta"; fi
          echo "name=curses-$ref" >> "$GITHUB_OUTPUT"

      # download from the run page (Actions tab)
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/curses.exe
            src-tauri/target/release/bundle/msi/*.msi

      # pushing a tag like v0.1.4-fixes or v0.1.4-beta also publishes a Release (Releases page),
      # which does not expire like the Actions downloads above
      - name: name the release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item src-tauri/target/release/curses.exe "release-files/curses-revival-${{ github.ref_name }}.exe"
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1 | Copy-Item -Destination "release-files/curses-revival-${{ github.ref_name }}.msi"

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: curses-revival ${{ github.ref_name }}
          # the steady fixes build is the default download: only it gets the "Latest" label
          make_latest: ${{ endsWith(github.ref_name, '-fixes') }}
          body: |
            **Which file?** `.exe` runs the program directly, `.msi` installs it. Windows 10 and 11.

            **Which build?** Releases ending in `-fixes` are the original program with bug fixes only: the steady choice. Releases ending in `-beta` get new features first and may have more bugs (up to 0.1.3 they ended in `-features`). Not sure? Take `-fixes`, or `-beta` if you need one of its features, such as Twitch login with your own Client ID.

            **What changed:** see [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) and the [setup guides](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/docs).

            **Windows warning:** the program is not signed, so Windows SmartScreen may say "Windows protected your PC". Press **More info**, then **Run anyway**, if you downloaded it from this page.
          fail_on_unmatched_files: true
          files: release-files/*

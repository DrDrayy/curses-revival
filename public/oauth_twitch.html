<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitch auth</title>
</head>
<body>

<script>
  // The token goes only to the curses app window. A fixed list, never '*' or an origin taken from the
  // url: any website can open this page through Twitch with its own url parameters.
  // (postMessage drops the message silently when the opener has a different origin)
  const APP_ORIGINS = ["https://tauri.localhost", "http://tauri.localhost", "http://localhost:1420"];
  if (document.location.hash && document.location.hash != '') {
    var parsedHash = new URLSearchParams(window.location.hash.substring(1));
    var access_token = parsedHash.get('access_token');
    if (access_token && window.opener) {
      const message = `smplstt_tw_auth:${access_token}`;
      for (const origin of APP_ORIGINS) {
        try {
          window.opener.postMessage(message, origin);
        } catch (e) {}
      }
    }
  }
  window.close();
</script>
</body>
</html>

<body>
  <div class="list-container">
    <div id="list"></div>
  </div>
  <div class="actionbar">
    <div class="logo">Curses remote microphone</div>
    <div class="actions">
      <select value="English" id="select-lang"></select>
      <select id="select-dial"></select>
      <button id="button-start" @click="pog()">Start</button>
    </div>
  </div>
  <script>
    (async () => {
      let selectedDial = 'en-Us';
      const selectLang = document.getElementById("select-lang");
      const selectDial = document.getElementById("select-dial");
      const buttonStart = document.getElementById("button-start");
      const listElement = document.getElementById("list");

      let host = location.hostname;
      let port = location.port;
      const q = new URLSearchParams(window.location.search.substring(1));
      // only this pc or the local network: a link must not point the page at someone else's server
      const isLocalHost = h => /^(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(h);
      if (q.has("host") && isLocalHost(q.get("host")))
        host = q.get("host");
      if (q.has("port") && /^\d{1,5}$/.test(q.get("port")))
        port = q.get("port");

      selectLang.oninput = e => handleSelectLang(e.target.value);
      selectDial.oninput = e => handleSelectDial(e.target.value);
      buttonStart.onclick = startSTT;

      function getDialectList(list, langGroup) {
        const langIndex = list.findIndex(l => l[0] === langGroup);
        if (langIndex < 0)
          return [];
        const l = [...langs[langIndex]]
        l.shift();
        return l;
      }


      let sttInstance = null
      let isStarted = false;

      const ws = new WebSocket(`ws://${host}:${port}/pubsub?id=${Math.random()}-${Date.now()}`);
      ws.onopen = () => console.log("opened");
      ws.onmessage = (msg) => {
        try {
          const { topic, data } = JSON.parse(msg.data);
          if (topic !== "inputfield.final" && topic !== "stt.final" || typeof data !== "string")
            return;
          addRowNode(data, topic);

        } catch (error) {}
      }
      

      function addRowNode(value, event) {
        if (listElement.childElementCount >= 20)
          listElement.firstChild.remove()
        const newDiv = document.createElement("div");
        // text only: messages must never be read as html
        const eventSpan = document.createElement("span");
        eventSpan.className = "event";
        eventSpan.textContent = event;
        const valueSpan = document.createElement("span");
        valueSpan.className = "value";
        valueSpan.textContent = value;
        newDiv.append(eventSpan, " ", valueSpan);
        listElement.append(newDiv);
      }

      // add languages
      function addOption(label, value, to) {
        const option = document.createElement("option");
        option.value = value;
        option.innerText = label;
        to.append(option);
      }
      langs.forEach(lang => addOption(lang[0], lang[0], selectLang));

      function handleSelectLang(langGroup) {
        const dialects = getDialectList(langs, langGroup);
        while (selectDial.firstChild)
          selectDial.removeChild(selectDial.firstChild);
        dialects.forEach(lang => addOption(`${lang[1] ?? langGroup}`, lang[0], selectDial));
        handleSelectDial(dialects[0][0]);
      }

      selectLang.value = 'English';
      handleSelectLang('English');
      function handleSelectDial(dialect) {
        selectedDial = dialect;
      }

      function send(obj) {
        (ws.OPEN === ws.readyState) && ws.send(JSON.stringify(obj));
      }

      // live (interim) text goes to the app at once, like the in-app services
      // (it used to drop updates for 0.4 s after each one, so captions lagged behind)
      function sendInterimThrottle(message) {
        send(message);
      }
    

      async function spawnInstance() {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
        sttInstance = new SpeechRecognition();
        sttInstance.continuous = true;
        sttInstance.interimResults = true;
        sttInstance.lang = selectDial.value;
        sttInstance.start();
        isStarted = true;

        const instance = sttInstance;
        const stopWithMessage = (message) => {
          clearTimeout(retryTimer);
          if (sttInstance === instance)
            startSTT(); // stop
          addRowNode(message, 'stt.error');
        };
        // this session got "start", when, and whether it has sent any result
        let sessionStarted = false;
        let sessionStartedAt = 0;
        let sessionHadResult = false;
        // live text not yet followed by a final result
        let pendingInterim = '';
        // Edge's online service ends every session after about 46-50 s with "network"; start a new
        // session at the next pause after this long, so the cut never lands in the middle of a sentence
        const ROLLOVER_AFTER = 35000;
        let rollingOver = false;
        // errors in a row since the last result, and "network" before "start" in a row
        let errorRun = 0;
        let refusedRun = 0;
        let retryTimer;
        // start() was called and "end" has not come yet (a new start() now would throw)
        let running = true;
        let beginWhenEnded = false;
        const begin = () => {
          clearTimeout(retryTimer);
          retryTimer = undefined;
          if (sttInstance !== instance)
            return;
          // the old session has not ended yet: start when it does, or after a safety wait if "end" never comes
          if (running) {
            beginWhenEnded = true;
            retryTimer = setTimeout(() => { running = false; begin(); }, 3000);
            return;
          }
          beginWhenEnded = false;
          sessionStarted = false;
          sessionHadResult = false;
          pendingInterim = '';
          rollingOver = false;
          try {
            instance.start();
            running = true;
          } catch (error) {
            // still running after all: try again shortly
            if (error && error.name === "InvalidStateError") {
              running = true;
              beginWhenEnded = true;
              retryTimer = setTimeout(() => { running = false; begin(); }, 1000);
              return;
            }
            stopWithMessage(`Listening stopped: ${error && error.message || error}. Press Start again.`);
          }
        };
        const restart = (delay) => {
          clearTimeout(retryTimer);
          retryTimer = setTimeout(begin, delay);
        };
        // the session ended without its final result: keep the words heard so far
        const flushInterim = () => {
          const text = pendingInterim;
          pendingInterim = '';
          if (/[^\uFFFD\s]/.test(text || "")) {
            send({topic: "text.stt",data: {type: 0, value: text}});
            addRowNode(text, 'stt.final');
          }
        };

        sttInstance.onstart = () => {
          sessionStarted = true;
          sessionStartedAt = performance.now();
          refusedRun = 0;
          buttonStart.textContent = "Listening..."
        }

        // keep alive: a normal end (silence) starts again at once, one that never started waits a second
        sttInstance.onend = () => {
          running = false;
          if (sttInstance !== instance)
            return;
          if (beginWhenEnded)
            return begin();
          if (retryTimer !== undefined)
            return;
          restart(sessionStarted ? 0 : 1000);
        };

        sttInstance.onresult = (event) => {
          errorRun = 0;
          sessionHadResult = true;
          try {
            let interim_transcript = '';
            let gotFinal = false;
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                gotFinal = true;
                // each final result once; "\uFFFD" alone (or nothing) is junk
                const final_transcript = event.results[i][0].transcript;
                if (!/[^\uFFFD\s]/.test(final_transcript || ""))
                  continue;
                send({topic: "text.stt",data: {type: 0, value: final_transcript}});
                addRowNode(final_transcript, 'stt.final');
              }
              else {
                interim_transcript += event.results[i][0].transcript;
                sendInterimThrottle({topic: "text.stt",data: {type: 1, value: interim_transcript}})
              }
            }
            pendingInterim = interim_transcript;
            // a pause after a long session: no words are waiting, so end it now and start a new one
            if (gotFinal && !interim_transcript && sessionStarted && !rollingOver
              && performance.now() - sessionStartedAt >= ROLLOVER_AFTER) {
              rollingOver = true;
              instance.abort();
            }
          } catch (error) { }
        }
        sttInstance.onerror = (e) => {
          console.log(e);
          // silence, or our own stop / new session at a pause
          if (sttInstance !== instance || e.error === "no-speech" || e.error === "aborted" || rollingOver)
            return;
          // the microphone or the service is not allowed, or the language is not offered: retrying can't help
          if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "language-not-supported")
            return stopWithMessage(`Listening stopped: ${e.error}. Check the microphone permission and the language, then press Start again.`);
          // refused twice in a row before it started: the speech service's daily limit, retrying can't help
          if (e.error === "network" && !sessionStarted && ++refusedRun >= 2)
            return stopWithMessage("The speech service refused to start. Most likely its free daily limit is used up (in Edge about 10 hours of speech a day). Try again later, or use Chrome.");
          if (e.error === "network") {
            // the words heard so far would be lost with this session
            flushInterim();
            // a session that was already answering got cut (Edge's regular cut after ~46 s): start again at once
            if (sessionStarted && sessionHadResult) {
              restart(0);
              try {
                instance.abort();
              } catch (error) { }
              return;
            }
          }
          // its "end" may never come: end it now and start again after a wait
          errorRun++;
          restart(Math.min(1000 * 2 ** (errorRun - 1), 10000));
          try {
            instance.abort();
          } catch (error) { }
        };

        window.onbeforeunload = () => {
          sttInstance && sttInstance.stop();
        }
      }

      function startSTT() {
        if (!isStarted)
          spawnInstance();
        else if (sttInstance) {
          isStarted = false;
          buttonStart.textContent = "Start"
          sttInstance.onend = null;
          sttInstance.stop();
          sttInstance = undefined;
        }
      }
    })();
